name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify
        working-directory: api
        run: ./mvnw -B verify

  analysis:
    name: Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify
        working-directory: analysis
        run: mvn -B verify

  server:
    name: Rust server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: Format
        working-directory: server
        run: cargo fmt --check
      - name: Clippy
        working-directory: server
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        working-directory: server
        run: cargo test --locked
      - name: Offline release build
        working-directory: server
        run: cargo build --release --offline

  ui:
    name: UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.13.1
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install
        working-directory: ui
        run: npm ci
      - name: Typecheck
        working-directory: ui
        run: npm run typecheck
      - name: Lint
        working-directory: ui
        run: npm run lint
      - name: Test
        working-directory: ui
        run: npm test
      - name: Audit
        working-directory: ui
        run: npm audit --audit-level=high
      - name: Build
        working-directory: ui
        run: npm run build

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.13.1
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Install
        working-directory: docs
        run: npm ci
      - name: Typecheck
        working-directory: docs
        run: npm run typecheck
      - name: Audit
        working-directory: docs
        run: npm audit --audit-level=high
      - name: Build
        working-directory: docs
        run: npm run build

  packaging:
    name: Compose and Helm
    runs-on: ubuntu-latest
    needs: [api, analysis, server, ui]
    steps:
      - uses: actions/checkout@v5
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build images
        run: docker compose build --pull
      - uses: azure/setup-helm@v4
        with:
          version: v3.22.1
      - name: Lint Helm chart
        run: helm lint helm/yl-toggle
      - name: Render Helm chart
        run: helm template yl-toggle helm/yl-toggle > /tmp/yl-toggle.yaml
