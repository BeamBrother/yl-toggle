# yl-toggle entry point & load balancer.
#
# backendAPI and serverAPI are scalable (docker compose --scale ...), so their
# traffic uses runtime DNS re-resolution (resolver + variable proxy_pass):
# nginx re-resolves the service name every `valid` seconds and balances across
# all current replicas without a reload.
#
# The upstream groups use runtime DNS re-resolution (the resolve parameter)
# and shared zones, so scaled replicas are picked up without an nginx reload.
# keepalive reuses backend connections on the high-QPS API paths.
# /server/realtime is socket.io and needs session stickiness for the
# long-polling handshake, so it uses ip_hash.
#
# Port map:
#   4009 - UI + management API (/api) + SDK paths (/server/api, /server/realtime)
#   4007 - evaluation API entry (same paths the serverAPI serves natively)
#   4011 - realtime entry

upstream backendApi {
    zone backend_api 64k;
    server backendAPI:4008 resolve;
    keepalive 64;
}

upstream serverApi {
    zone server_api 64k;
    server serverAPI:4007 resolve;
    keepalive 64;
}

# sticky upstream for socket.io (long-polling transport support)
upstream serverRealtime {
    zone server_realtime 32k;
    ip_hash;
    server serverAPI:4011 resolve;
}

resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
}

# ---------------- UI + management (4009) ----------------
server {
  listen 4009;

  resolver 127.0.0.11 valid=10s ipv6=off;

  location / {
    index  index.html index.htm;
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }

   location /api {
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-NginX-Proxy true;
    proxy_set_header Host $http_host;
    proxy_cache_bypass $http_upgrade;
    proxy_redirect off;
    proxy_pass http://backendApi;
  }

  # health probes + serverAPI<->backendAPI internal sync API (mirror of helm's
  # enable_internal_endpoints; restrict at the network edge in real deployments)
  location /actuator/ {
    proxy_set_header Host $http_host;
    set $backend_api http://backendAPI:4008;
    proxy_pass $backend_api$request_uri;
  }

  location /internal/ {
    proxy_set_header Host $http_host;
    set $backend_api http://backendAPI:4008;
    proxy_pass $backend_api$request_uri;
  }

  location /server/api {
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-NginX-Proxy true;
    proxy_set_header Host $http_host;
    proxy_buffering on;
    rewrite ^/server(/.*)$ $1 break;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_pass http://serverApi;
  }

  location /server/realtime {
    proxy_pass http://serverRealtime;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_http_version 1.1;
    proxy_pass_request_headers on;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
  }

  location /api-docs {
    proxy_pass http://redoc/;
  }

  # redoc static files
  location /redoc {
    proxy_pass http://redoc/redoc;
  }
}

# ---------------- evaluation API entry (4007) ----------------
server {
  listen 4007;

  resolver 127.0.0.11 valid=10s ipv6=off;

  # Server-only internal endpoints must not be exposed through the public
  # evaluation entry. backendAPI reaches serverAPI over the Compose network.
  location ^~ /internal/ {
    return 404;
  }

  location / {
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Host $http_host;
    proxy_buffering on;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_pass http://serverApi;
  }
}

# ---------------- realtime entry (4011) ----------------
server {
  listen 4011;

  location / {
    proxy_pass http://serverRealtime;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_http_version 1.1;
    proxy_pass_request_headers on;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
  }
}



