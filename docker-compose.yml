# This docker compose setup configures a horizontally scalable single-host
# deployment:
# - the yl-toggle API instances + the necessary backing MariaDB database
# - the yl-toggle UI (nginx entry point + load balancer for the scaled services)
# - the yl-toggle Server (evaluation) instances
# - the yl-toggle analysis API + OpenAPI document
#
# Scale out with:
#   docker compose up -d --scale backendAPI=2 --scale serverAPI=2
#
# Only the ui service publishes host ports; backendAPI/serverAPI traffic is
# balanced by the ui nginx across all replicas (dynamic DNS re-resolution).

services:
  backendAPI:
    image: yl-toggle/api:3.0.0
    build:
      context: ./api
      dockerfile: Dockerfile
    environment:
      - spring.datasource.jdbc-url=jdbc:mariadb://database:13306/yl-toggle?useSSL=false&characterEncoding=utf8&autoReconnect=true&failOverReadOnly=false&rewriteBatchedStatements=TRUE&useSSL=false&serverTimezone=Asia/Shanghai
      - spring.profiles.active=online
      - spring.jpa.show-sql=false
      - logging.level.root=INFO
      - logging.level.org.hibernate.SQL=INFO
      - logging.level.org.hibernate.type.descriptor.sql.BasicBinder=INFO
      - app.analysis-base-url=http://analysisAPI:4006
      - app.server-base-urls=http://serverAPI:4007
      - server.port=4008
      - TZ=Asia/Shanghai
      # keep per-replica heap modest when running several replicas in the
      # Docker Desktop VM; raise for real hardware
      - JVM_ARGS=-Xmx768m
    networks:
      - yl-toggle-net
    depends_on:
      database:
        condition: service_healthy
      analysisAPI:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4008/actuator/health"]
      timeout: 5s
      interval: 10s
      retries: 10
      start_period: 60s

  serverAPI:
    image: yl-toggle/server:3.0.0
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      - RUST_LOG=info
      - YT_SERVER_PORT=4007
      - YT_REALTIME_PORT=4011
      - YT_TOGGLES_URL=http://backendAPI:4008/internal/server/toggles
      - YT_EVENTS_URL=http://backendAPI:4008/internal/server/events
      - YT_KEYS_URL=http://backendAPI:4008/internal/server/sdk_keys
      - YT_ANALYSIS_URL=http://analysisAPI:4006/events
      - YT_REFRESH_SECONDS=3
      - TZ=Asia/Shanghai
    networks:
      - yl-toggle-net
    depends_on:
      backendAPI:
        condition: service_healthy
      analysisAPI:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "./healthcheck"]
      timeout: 5s
      interval: 10s
      retries: 10
      start_period: 10s

  ui:
    image: yl-toggle/ui:3.0.0
    build:
      context: ./ui
      dockerfile: Dockerfile
    ports:
      - "4009:4009"
      - "4007:4007"
      - "4011:4011"
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./nginx_configs/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - yl-toggle-net
    depends_on:
      backendAPI:
        condition: service_healthy
      serverAPI:
        condition: service_healthy
      analysisAPI:
        condition: service_healthy
      redoc:
        condition: service_started
      database:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4009/"]
      timeout: 5s
      interval: 10s
      retries: 10
      start_period: 10s

  analysisAPI:
    image: yl-toggle/analysis:3.0.0
    build:
      context: ./analysis
      dockerfile: Dockerfile
    ports:
      - "4006:4006"
    environment:
      - TZ=Asia/Shanghai
      - app.datasource.jdbcUrl=jdbc:mariadb://database:13306/yl-toggle-events
      - app.datasource.username=root
      - app.datasource.password=root
      - spring.profiles.active=online
    networks:
      - yl-toggle-net
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4006/actuator/health"]
      timeout: 5s
      interval: 10s
      retries: 10
      start_period: 60s

  database:
    image: mariadb:11.8.9
    ports:
      - "23306:13306"
    networks:
      - yl-toggle-net
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=yl-toggle
      - MYSQL_TCP_PORT=13306
    volumes:
      - ./scripts/db:/docker-entrypoint-initdb.d
      - yl-toggle-db-data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "127.0.0.1", "-P", "13306", "-uroot", "-proot"]
      timeout: 5s
      interval: 10s
      retries: 10
      start_period: 60s

  redoc:
    image: redocly/redoc:v2.5.3
    environment:
      - SPEC_URL=/api/v3/api-docs.yaml
      - PORT=4010
      - PAGE_TITLE=yl-toggle OpenAPI
    networks:
      - yl-toggle-net
    restart: unless-stopped

networks:
  yl-toggle-net:

volumes:
  yl-toggle-db-data:
