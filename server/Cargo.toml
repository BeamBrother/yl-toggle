[package]
edition = "2021"
name = "yl-toggle-server"
version = "2.0.1"
license = "Apache-2.0"
authors = ["maintain@yl-toggle.com"]
description = "yl-toggle Server for evaluating feature toggles"

[[bin]]
name = "yl-toggle-server"
path = "src/main.rs"

[lib]
name = "yl_toggle_server"
path = "src/lib.rs"

[features]
default = ["realtime"]
unstable = []
realtime = ["socketio-rs"]

[dependencies]
anyhow = "1.0"
axum = { version = "0.5", features = ["headers"] }
axum-extra = { version = "0.2", features = ["typed-routing"] }
base64 = "0.13"
config = "0.13"
futures = "0.3"
log = "0.4"
parking_lot = "0.12"
reqwest = { version = "0.11", default-features = false, features = [
  "rustls-tls",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1", features = ["full"] }
time = { version = "0.3", features = ["formatting", "local-offset", "macros"] }
tracing = "0.1"
tracing-core = "0.1"
tracing-log = "0.1"
tracing-subscriber = { version = "0.3", features = [
  "local-time",
  "env-filter",
] }
url = "2.3"
socketio-rs = { optional = true, version = "0.1.7", default-features = false, features = ["server"] }
yl-toggle-server-sdk = { version = "2.3.0", features = [
  "internal",
], default-features = false }
yl-toggle-event = { version="1.2.0", features = [
  "use_tokio",
  "collector",
], default-features = false }

[dev-dependencies]
rusty-hook = "^0.11.2"

[patch.crates-io]
yl-toggle-server-sdk = { path = "vendor/yl-toggle-server-sdk" }
yl-toggle-event = { path = "vendor/yl-toggle-event" }
